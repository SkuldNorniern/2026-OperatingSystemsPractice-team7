# launch sets per mode, dont set here: output_dir, time_limit, expected_targets, nav_action,
# costmap_topic, scan_topic (slam), mode and cmd_vel_topic (navigator), image_topic, marker_size,
# map_origin_shift (marker_mapper, mission)

marker_mapper:
  ros__parameters:
    detections_topic: /aruco_detections
    map_topic: /map
    map_frame: map
    csv_name: targets.csv
    max_range: 4.0
    occupied_threshold: 65
    range_ratio_gate: 3.0
    allow_pnp_fallback: true
    max_abs_bearing_z: 0.8
    min_views: 5
    max_spread: 0.08          # m, fused position 1 sigma
    max_consistency: 3.0      # median mahalanobis distance of views, bigger = views disagree
    max_history: 200
    scale_tolerance: 0.25     # learned per marker: ray/pnp range ratio, rejects rays that hit something in front
    scale_min_samples: 3
    min_view_move: 0.05       # m, new view only counts after camera moved or turned
    min_view_turn: 0.05       # rad
    wall_fit_radius: 0.2      # m, fit line to wall cells around ray hit, 0 = raw cell hit
    bearing_sigma: 0.012      # rad, camera bearing + map yaw error
    wall_sigma: 0.03          # m, map wall position error
    pnp_sigma: 0.08           # pnp range error after scale learned, fraction
    edge_ratio_gate: 1.5      # ray hit near end of a surface (box face) needs ray/pnp within this factor until scale is learned
    ignore_ids: [-1]
    slow_on_tentative: true   # /speed_limit while an unconfirmed marker is in view
    slow_percent: 40.0
    slow_hold: 2.5
    image_time_offset: 0.0    # s, add to image stamp if camera stamps are late/early

explorer:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    period: 1.0
    goal_timeout: 120.0
    progress_timeout: 30.0
    progress_epsilon: 0.1
    retry_delay: 5.0
    blacklist_duration: 45.0
    turn_weight: 0.5
    goal_standoff: 0.3
    free_threshold: 50
    traversable_threshold: 99
    frontier_segment_length: 1.2
    min_frontier_cells: 8
    size_weight: 1.0
    distance_weight: 1.5
    blacklist_radius: 0.7
    min_goal_distance: 0.65
    camera_coverage: true     # after frontiers, drive to look at walls the camera has not seen
    coverage_map_topic: /map
    camera_half_fov: 0.52     # rad, OAK-D preview is ~60 deg wide
    camera_range: 2.5         # m, where markers still get detected
    view_standoff: 1.6
    view_max_cells: 32        # wall piece per view (cells)
    view_detour: 0.0          # m, take a close camera view during frontier phase, 0 = off

velocity_guard:
  ros__parameters:
    input_topic: /cmd_vel_filtered
    output_topic: /cmd_vel
    max_forward: 0.18
    max_turn: 0.5
    command_timeout: 0.5

mission:
  ros__parameters:
    autosave_period: 60.0
    map_name: map
    map_topic: /map

scan_filter:
  ros__parameters:
    scan_topic: /scan
    output_topic: /scan_filtered
    odom_topic: /odom
    min_range: 0.18
    max_range: 8.0
    median_window: 3
    isolated_dist: 0.15
    deskew: true
    stamp_at_end: false

slam:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    resolution: 0.05
    min_travel_dist: 0.1
    loop_prefer_oldest: false  # loop edge to oldest keyframe in radius, matched on its own scans
    min_travel_yaw: 0.1
    max_range: 8.0
    map_publish_period: 1.0
    transform_publish_period: 0.05

navigator:
  ros__parameters:
    action_name: /team7/navigate_to_pose
    follow_action: /follow_path
    controller_id: FollowPath
    map_topic: /map
    scan_topic: /scan
    odom_topic: /odom
    robot_radius: 0.18
    safety_margin: 0.05
    cost_scaling_dist: 0.5
    cost_weight: 2.0
    allow_unknown: true
    goal_tolerance: 0.3
    replan_period: 2.0
    goal_timeout: 90.0
    smooth_iterations: 2
    use_scan_obstacles: true
    mppi_samples: 1000
    mppi_horizon: 40
    mppi_threads: 4
    vx_max: 0.18             # velocity_guard caps at 0.18 m/s, 0.5 rad/s
    wz_max: 0.5
    goal_tolerance_xy: 0.15
    goal_tolerance_yaw: 0.3

aruco_detector:
  ros__parameters:
    marker_dict: 6X6_250         # same as aruco.yaml. test markers are 6X6_250; exam is ARUCO_ORIGINAL ARUCO_ORIGINAL, 4X4_50 .. 7X7_1000, APRILTAG_16H5/25H9/36H10/36H11
    image_transport: compressed  # compressed | raw
    max_hamming: 1            # bit errors corrected, capped per dictionary
    min_side_px: 8.0
    refine_corners: true
    debug_every: 3
