# launch sets per mode, dont set here: output_dir, time_limit, expected_targets, nav_action,
# costmap_topic, scan_topic (slam), mode and cmd_vel_topic (navigator), image_topic, marker_dict,
# marker_size, map_origin_shift (marker_mapper, mission)

marker_mapper:
  # publishes /team7/marker_approach (MarkerArray ns tentative, id = aruco id, map frame): tentative markers with 2+ views at their fused
  # position, oriented along the face normal toward the side they were seen from; the explorer's
  # approach_* parameters pick the viewpoints
  ros__parameters:
    detections_topic: /aruco_detections
    map_topic: /map
    map_frame: map
    csv_name: targets.csv
    max_range: 4.0
    occupied_threshold: 65
    range_ratio_gate: 3.0
    allow_pnp_fallback: true
    max_abs_bearing_z: 0.8
    min_views: 5
    min_wall_views: 3         # views whose ray hits a lidar surface; targets are on faces that reach the floor
    min_wall_fraction: 0.25   # and this share of all views (chair label in 184838: 3 of 39)
    min_triangulation_spread: 0.2   # rad; views must spread this far before confirming, and their bearings'
    max_triangulation_gap: 0.3      # m intersection must agree with the fused position (labels in front of a wall fail)
    min_range: 0.3            # m, ignore hits / pnp ranges closer to the camera (robot's own cells)
    strict_ids: []           # empty: computed from the dictionary's barcode-like ids (barcode_max_flips)
    barcode_max_flips: 1     # stripe flips at most this -> barcode-like (ARUCO_ORIGINAL: 0, 341, 682, 1023)
    require_scale_all: true   # every id needs a consistent learned size (wall range vs pnp agree across views). Sim
                              # (approach on, 12 runs): all 3 confirmed 11/12 vs 10/12 without, 0 decoys; closes the
                              # case of a mid-air sticker confirmed after approach views (1 of 30 runs)
    max_spread: 0.08          # m, fused position 1 sigma
    max_consistency: 12.0     # median mahalanobis distance of views, bigger = views disagree. 3.0 -> 12 (2026-11-20):
                              # real marker 5 (run 153653) failed at 10.6; decoys 0/1023/103 stayed unconfirmed on 3 real runs and in the sim
    max_history: 200
    scale_tolerance: 0.4      # learned per marker: ray/pnp range ratio, rejects rays that hit something in front (0.25 -> 0.4, same change)
    scale_min_samples: 2      # 3 -> 2: a learned scale is reached sooner (same change)
    min_view_move: 0.05       # m, new view only counts after camera moved or turned
    min_view_turn: 0.05       # rad
    wall_fit_radius: 0.2      # m, fit line to wall cells around ray hit, 0 = raw cell hit
    bearing_sigma: 0.012      # rad, camera bearing + map yaw error
    wall_sigma: 0.03          # m, map wall position error
    pnp_sigma: 0.08           # pnp range error after scale learned, fraction
    edge_ratio_gate: 1.5      # ray hit near end of a surface (box face) needs ray/pnp within this factor until scale is learned
    edge_triangulation_gap: 0.15  # m, edge hit where earlier bearings cross is on the face: teaches the scale (spec: marker sizes differ)
    ignore_ids: [-1]
    # camera-only confirmation (0 = off): a marker with no lidar wall hit confirms from views whose bearings
    # spread >= 0.35 rad and cross within max_triangulation_gap. Offline on 10 saved runs: +1 real (marker 5, run
    # 152437), no false confirmations (decoys 0/103/703/1023 stay unconfirmed; 0 and 1023 are strict, always excluded)
    pnp_only_spread: 0.35
    slow_on_tentative: true   # /speed_limit while an unconfirmed marker is in view
    slow_percent: 75.0
    slow_hold: 2.5
    image_time_offset: 0.0    # s, add to image stamp if camera stamps are late/early

explorer:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    period: 1.0
    goal_timeout: 75.0       # s per goal; above the navigator's 60 s so the navigator's limit applies
    approach_budget: 180.0   # s of approach trips for the whole run (3 min of marker search, per the task); 0 = no limit
    progress_timeout: 15.0    # s without 0.1 m of movement: give the goal up (field runs lost 30 s per stuck goal)
    progress_epsilon: 0.1
    blacklist_duration: 45.0
    blacklist_max_duration: 300.0  # s, ban doubles per failure at one spot (183647 replay cycled 3 failing goals)
    turn_weight: 0.5
    goal_standoff: 0.3
    free_threshold: 50
    traversable_threshold: 65  # = occupied_threshold: cells 65-98 are obstacles for the planner, so the explorer must not walk them (was 99)
    frontier_segment_length: 1.2
    min_frontier_cells: 12    # 0.6 m; 0.4 m leftovers near box corners cost 80 s in the sim studio
    size_weight: 1.0
    distance_weight: 1.5
    blacklist_radius: 0.7
    min_goal_distance: 0.65
    camera_coverage: true     # after frontiers, drive to look at walls the camera has not seen
    coverage_map_topic: /map
    camera_half_fov: 0.52     # rad, OAK-D preview is ~60 deg wide
    camera_range: 1.5         # m, head-on distance a marker is still read: 250 px preview, fx 201 px, 10 cm marker = 13 px
                              # (8 px detector floor at 2.5 m); seen at an angle counts as range / cos(incidence)
    camera_max_incidence: 1.3 # rad, wall seen further off its normal than this does not count as seen
    view_standoff: 1.0        # m from the wall when looking at it (also inside the 2 m scoring radius)
    view_max_cells: 32        # wall piece per view (cells)
    view_detour: 1.0          # m, take a camera view of an unseen wall this close during the frontier phase, 0 = off
    preempt_distance: 0.5     # m, a frontier goal this close is replaced by the next one once its frontier starts to go
    switch_cooldown: 20.0     # s, a goal switched away from is not picked again (sim studio: 2 goals swapped for 8 min)
    min_unknown_area: 1.0     # m^2, skip frontiers onto enclosed unknown pockets smaller than this (box insides)
    goal_max_unknown: 0.15    # share of unknown cells allowed around a frontier goal; 0 deadlocked a parked
                              # robot in clutter (field 184838 waited 75 s until pushed: speckled one-scan map)
    min_free_fraction: 0.5    # skip frontiers whose free side is a thin spike (lidar beams through chair legs);
                              # sim 3 seeds x 2 worlds: all 3 targets confirmed 6/6 vs 4/6 without
    look_around_turns: 3      # 120 deg in-place turns when nothing is left to explore (start deadlock), 0 = off
    retry_delay: 5.0          # s, wait after a failed or cancelled goal; a success chains on at once
    # approach on sight: a marker marker_mapper holds but has not confirmed (/team7/marker_approach) is looked at
    # from approach_standoff in front and +-approach_spread around its facing direction, before any frontier or
    # camera view; stops as soon as it is confirmed. A decoy is given up after the timeout, max_failures failed
    # views or all three views done, and then ignored for approach_blacklist_duration
    approach_markers: true    # sim studio + studio_glass, seeds 1-3, two batches: all 3 targets confirmed in 10/12
                              # runs (off: 2/12); one decoy confirmed in 30 approach-on runs (sticker in mid-air)
    approach_topic: /team7/marker_approach
    approach_standoff: 1.3    # m from the marker (inside the 2 m scoring radius)
    approach_max_standoff: 1.9  # m, never further when the standoff point is blocked
    approach_spread: 0.52     # rad, views at 0 and +-30 deg off the face normal (triangulation wants >= 0.2 rad)
    approach_timeout: 90.0    # s from the first approach goal to giving the marker up
    approach_max_failures: 2  # failed views (aborted / no progress / timeout) before giving up
    approach_blacklist_duration: 300.0  # s a given-up marker is ignored, so a decoy cannot trap the robot

velocity_guard:
  ros__parameters:
    input_topic: /cmd_vel_filtered
    output_topic: /cmd_vel
    max_forward: 0.30        # m/s, Create 3 safe-mode limit is about 0.31 (0.306 with safety_override none)
    max_turn: 0.7
    command_timeout: 0.5

mission:
  ros__parameters:
    autosave_period: 60.0
    map_name: map
    map_topic: /map

scan_filter:
  ros__parameters:
    scan_topic: /scan
    output_topic: /scan_filtered
    odom_topic: /odom
    min_range: 0.18
    max_range: 10.0          # was 8.0; RPLIDAR A1M8 reaches 12 m, 10 m explores ~26 % more than 8 m on the same 150 s replay
    median_window: 3
    isolated_dist: 0.15
    deskew: true
    stamp_at_end: false

slam:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    resolution: 0.05
    min_travel_dist: 0.1
    loop_prefer_oldest: false  # loop edge to oldest keyframe in radius, matched on its own scans
    min_travel_yaw: 0.1
    max_range: 10.0          # was 8.0, matches scan_filter
    map_publish_period: 1.0
    map_odom_scan_stamp: 0.0  # 1.0 = stamp map->odom with the scan time (test on replay first); 0.0 = current live behaviour
    scan_time_offset: -0.15  # s added to the scan stamp for the odom lookup. Replay 184838 through the full launch:
                             # map->odom jump per update 6.0 -> 3.5 cm mean, 1.0 -> 0.5 deg; about one A1 rotation,
                             # so likely the driver stamping the end of the sweep (see stamp_at_end)
    transform_publish_period: 0.05
    # published map->odom blends each correction in with this time constant (s, 0 = off); corrections
    # beyond jump_lin (m) / jump_ang (rad) are applied at once. Offline replay of the 3 field bags:
    # visible robot hops (>1 cm or 0.3 deg per 50 ms tick) -60..-75 %, added lag mean 2-3 mm, p95 1-1.4 cm
    map_odom_smoothing: 0.3
    map_odom_jump_lin: 0.1
    map_odom_jump_ang: 0.03
    # published /map only: occupied above publish_occupied_on, stays occupied while above
    # publish_occupied_keep (log-odds, keep > 0 so redraws still clear old walls). Offline: cells that
    # drop out and come back between maps -25..-45 %, ~5-12 % more occupied cells
    publish_occupied_on: 0.6
    publish_occupied_keep: 0.3
    icp_max_flatness: 0.1  # 0.3-0.6 makes icp engage on A1 data but was not better offline

navigator:
  ros__parameters:
    action_name: /team7/navigate_to_pose
    follow_action: /follow_path
    controller_id: FollowPath
    map_topic: /map
    scan_topic: /scan
    odom_topic: /odom
    robot_radius: 0.18
    safety_margin: 0.05
    cost_scaling_dist: 0.5
    cost_weight: 2.0
    allow_unknown: true
    goal_tolerance: 0.3
    replan_period: 2.0
    goal_timeout: 60.0       # s per goal: a view or frontier that takes longer is cancelled (the explorer progress check cancels stuck goals at 15 s)
    smooth_iterations: 2
    use_scan_obstacles: true
    mppi_samples: 1000
    mppi_horizon: 40
    mppi_threads: 4
    vx_max: 0.30             # same as velocity_guard and velocity_smoother. 0.26 was tuned in sim (studio, 10 seeds: 9/10 at
                             # median 348 s vs 7/10 at 401 s with 0.18, no collisions). 0.30 is NOT sim-tested yet.
                             # marker_mapper slows to 75 % near an unconfirmed marker
    wz_max: 0.7
    goal_tolerance_xy: 0.15
    goal_tolerance_yaw: 0.3

aruco_detector:
  ros__parameters:
    image_transport: compressed  # compressed | raw
    max_hamming: 1            # 1 bit corrected, as OpenCV does: a cable or leg over one bit still decodes. Costs more
                              # false ids (field 2026-11-18: 128 vs 36 in 27k frames); marker_mapper's wall rules stop
                              # them (replay 184838: 0 confirmed, chair label had 3 of 39 views lidar-backed)
    min_side_px: 8.0
    refine_corners: true
    max_border_errors: 0      # border cells read white allowed. 0: field frames 28 -> 6, 8 -> 2 false hits (183647, 185946),
                              # bench sheet lost 0.5 % of real detections (stream_eval "border0")
    exact_stripe_ids: true    # ids 0, 341, 682, 1023 only without bit correction: a dark panel with a bright strip
                              # reads as id 0 after one fix (seat underside in 184838); printed id 0 read exactly 624/624
    max_stripe_flips: -1      # barcode filter (rejects ids 0, 341, 682, 1023) OFF: a real id 0 is 16-80 px, chair
                              # labels 8-50 px, so it would hide a real target. marker_mapper wall views stop the labels
    debug_every: 3
