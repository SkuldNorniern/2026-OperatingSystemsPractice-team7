# launch sets per mode, dont set here: output_dir, time_limit, expected_targets, nav_action,
# costmap_topic, scan_topic (slam), mode (navigator), image_topic, marker_size

marker_mapper:
  ros__parameters:
    detections_topic: /aruco_detections
    map_topic: /map
    map_frame: map
    csv_name: targets.csv
    max_range: 4.0
    occupied_threshold: 65
    range_ratio_gate: 3.0
    allow_pnp_fallback: true
    max_abs_bearing_z: 0.8
    min_views: 5
    max_spread: 0.25
    max_history: 200
    ignore_ids: [-1]

explorer:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    period: 1.0
    goal_timeout: 60.0
    progress_timeout: 15.0
    progress_epsilon: 0.1
    frontier_gone_radius: 0.5
    free_threshold: 50
    min_frontier_cells: 8
    size_weight: 1.0
    distance_weight: 1.0
    blacklist_radius: 0.5
    min_goal_distance: 0.3

mission:
  ros__parameters:
    autosave_period: 60.0
    map_name: map
    map_topic: /map

scan_filter:
  ros__parameters:
    scan_topic: /scan
    output_topic: /scan_filtered
    odom_topic: /odom
    min_range: 0.18
    max_range: 8.0
    median_window: 3
    isolated_dist: 0.15
    deskew: true
    stamp_at_end: false

slam:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    resolution: 0.05
    min_travel_dist: 0.1
    min_travel_yaw: 0.1
    max_range: 8.0
    map_publish_period: 1.0
    transform_publish_period: 0.05

navigator:
  ros__parameters:
    action_name: /team7/navigate_to_pose
    follow_action: /follow_path
    controller_id: FollowPath
    map_topic: /map
    scan_topic: /scan
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel
    robot_radius: 0.18
    safety_margin: 0.05
    cost_scaling_dist: 0.5
    cost_weight: 2.0
    allow_unknown: true
    goal_tolerance: 0.3
    replan_period: 2.0
    goal_timeout: 90.0
    smooth_iterations: 2
    use_scan_obstacles: true
    mppi_samples: 1000
    mppi_horizon: 40
    mppi_threads: 4
    vx_max: 0.30
    wz_max: 1.9
    goal_tolerance_xy: 0.15
    goal_tolerance_yaw: 0.3

aruco_detector:
  ros__parameters:
    max_hamming: 1
    min_side_px: 8.0
    refine_corners: true
    debug_every: 3
