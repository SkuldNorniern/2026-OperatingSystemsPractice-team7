[workspace]
resolver = "3"
members = ["crates/*"]
# plain `cargo build` / `cargo test` skip the aurea crates (Rust >= 1.90; tb4_viewer also needs GTK);
# build them with `-p tb4_draw`, `-p tb4_viewer` or `--workspace`
default-members = [
    "crates/tb4_aruco", "crates/tb4_control", "crates/tb4_core", "crates/tb4_explore", "crates/tb4_markers",
    "crates/tb4_planning", "crates/tb4_scan", "crates/tb4_sim", "crates/tb4_slam",
]
exclude = ["host_ws", "rpi4_ws"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
nalgebra = "0.35"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
