[package]
name = "tb4_draw"
version = "0.1.0"
description = "Top-down drawing shared by the sim viewer and the ROS viewer: palette, viewport, map image, primitives, painted with aurea"
edition.workspace = true
# aurea needs 1.90
rust-version = "1.90"
license.workspace = true

[dependencies]
# only the renderer part of aurea: no window toolkit, so this crate builds and tests without GTK
aurea-render = { git = "https://github.com/SkuldNorniern/aurea", rev = "ed32453" }
aurea-foundation = { git = "https://github.com/SkuldNorniern/aurea", rev = "ed32453" }
tb4_core = { path = "../tb4_core" }
